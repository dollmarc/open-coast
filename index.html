<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Coast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* DS color tokens */
  --sage: #c8d8c0;
  --mist: #c5d4e0;
  --sand: #e8dcc8;
  --blush: #e0c8cc;
  --foam: #dce8e4;
  --lavender: #d4cce0;
  --sky: #ccdce8;
  --dusk: #4a5568;
  --ink: #2d3748;
  --stone: #718096;
  --stone-soft: #a0aab8;
  --pale: #f7f5f0;
  --pale-warm: #faf8f3;
  --white: #ffffff;
  --hairline: rgba(45,55,72,0.10);
  --hairline-soft: rgba(45,55,72,0.05);
  --shadow-sm: 0 1px 2px rgba(45,55,72,0.04), 0 1px 3px rgba(45,55,72,0.03);
  --shadow-md: 0 4px 12px rgba(45,55,72,0.07), 0 1px 3px rgba(45,55,72,0.04);
  --shadow-lg: 0 12px 32px rgba(45,55,72,0.08), 0 2px 8px rgba(45,55,72,0.04);
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 24px;
  --r-pill: 999px;

  /* Backward-compat aliases for JS-generated inline styles */
  --accent: #5b8fa8;
  --accent-light: var(--mist);
  --surface: var(--pale);
  --surface-alt: #eef0eb;
  --ink-mid: var(--stone);
  --ink-light: var(--stone-soft);
  --black: var(--ink);
  --rule: 1px solid var(--hairline);
  --rule-heavy: 2px solid var(--hairline);
}

html { font-size: 16px; }

body {
  font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--pale);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  top: -20%; left: -10%;
  width: 60%; height: 60%;
  background: radial-gradient(ellipse, rgba(197,212,224,0.28) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -10%; right: -5%;
  width: 50%; height: 50%;
  background: radial-gradient(ellipse, rgba(200,216,192,0.22) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

header, nav, main, footer { position: relative; z-index: 1; }

/* ── MASTHEAD ── */
.masthead {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: stretch;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hairline);
  box-shadow: var(--shadow-sm);
}

.masthead-left {
  padding: 28px 36px 24px;
  border-right: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 0;
}

.masthead-eyebrow {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--stone-soft);
  margin-bottom: 10px;
}

.masthead-title {
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 0.95;
  color: var(--ink);
}

.masthead-title em {
  font-style: normal;
  font-weight: 300;
  color: var(--stone);
}

.masthead-right {
  padding: 24px 28px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  min-width: 180px;
  gap: 12px;
  background: rgba(255,255,255,0.4);
}

.open-counter { text-align: right; }

.open-counter .num {
  font-size: 64px;
  font-weight: 300;
  line-height: 1;
  display: block;
  color: var(--dusk);
  letter-spacing: -0.02em;
}

.open-counter .label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  display: block;
  margin-top: 4px;
  color: var(--stone);
}

.open-counter .sublabel {
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--stone-soft);
  display: block;
  margin-top: 2px;
}



/* ── NAV SHELL ── */
nav.toolbar {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--hairline);
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow-sm);
}

/* ── ROW 1: LOCATION TABS ── */
.nav-row-locations {
  display: flex;
  align-items: flex-end;
  padding: 0 28px;
  border-bottom: 1px solid var(--hairline);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  gap: 0;
  flex-shrink: 0;
  position: sticky;
  left: 0;
  width: 100%;
}
.nav-row-locations::-webkit-scrollbar { display: none; }

.loc-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 14px 16px 11px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--stone-soft);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
  flex-shrink: 0;
  margin-bottom: -1px;
  position: relative;
}

.loc-tab:hover { color: var(--stone); }
.loc-tab.active {
  font-weight: 600;
  color: var(--ink);
  border-bottom-color: var(--dusk);
}

/* ── ROW 2: CONTROLS ── */
.nav-row-controls {
  display: flex;
  align-items: center;
  padding: 8px 28px;
  gap: 20px;
  flex-wrap: wrap;
  min-height: 48px;
}

/* Each labelled group */
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.ctrl-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--stone-soft);
  margin-right: 4px;
  white-space: nowrap;
}

/* Pill chips */
.chip {
  background: rgba(255,255,255,0.6);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  padding: 5px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--stone);
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s, box-shadow .12s;
  box-shadow: var(--shadow-sm);
}

.chip:hover {
  color: var(--ink);
  border-color: rgba(45,55,72,0.2);
  background: rgba(255,255,255,0.9);
  box-shadow: var(--shadow-md);
}

.chip.active {
  font-weight: 600;
  color: var(--dusk);
  border-color: rgba(74,85,104,0.35);
  background: rgba(74,85,104,0.1);
  box-shadow: none;
  letter-spacing: 0.01em;
}

/* Divider between groups */
.ctrl-divider {
  width: 1px;
  height: 16px;
  background: var(--hairline);
  flex-shrink: 0;
}

/* ── SEARCH TRIGGER IN MASTHEAD ── */
.search-trigger {
  background: rgba(255,255,255,0.6);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  cursor: pointer;
  color: var(--stone);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 10px;
  transition: color .15s, background .15s, box-shadow .15s;
  margin-top: auto;
  align-self: flex-end;
  box-shadow: var(--shadow-sm);
}
.search-trigger:hover { color: var(--ink); background: rgba(255,255,255,0.9); box-shadow: var(--shadow-md); }
.search-trigger.active { color: var(--dusk); background: var(--mist); border-color: rgba(91,143,168,0.3); }

/* ── SEARCH PANEL (replaces loc row when open) ── */
.search-panel {
  display: none;
  align-items: center;
  padding: 0 28px;
  height: 0;
  overflow: hidden;
  border-bottom: 1px solid var(--hairline);
  background: rgba(255,255,255,0.7);
  transition: height .2s ease;
}
.search-panel.open {
  display: flex;
  height: 49px;
}

.search-panel-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 520px;
}

.search-panel svg { color: var(--stone); flex-shrink: 0; }

.search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 0.01em;
  color: var(--ink);
  min-width: 0;
}
.search-input::placeholder { color: var(--stone-soft); font-style: italic; font-size: 14px; }

.search-close {
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--stone-soft);
  padding: 4px 0;
  transition: color .15s;
  white-space: nowrap;
}
.search-close:hover { color: var(--ink); }

.search-result-count {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--stone-soft);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .2s;
}
.search-result-count.visible { opacity: 1; }

/* Time badge */
.time-badge {
  margin-left: auto;
  font-size: 11px;
  letter-spacing: 0.06em;
  font-weight: 400;
  color: var(--stone-soft);
  white-space: nowrap;
  flex-shrink: 0;
}


/* ── MAIN LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 1fr;
}

.layout.split {
  grid-template-columns: 420px 1fr;
}

/* ── LIST PANE ── */
.list-pane { border-right: 1px solid var(--hairline); background: rgba(255,255,255,0.45); }

.list-scroll {
  overflow-y: auto;
  max-height: calc(100vh - 190px);
  scrollbar-width: thin;
  scrollbar-color: var(--mist) transparent;
}

/* Section headers */
.list-section-head {
  display: grid;
  grid-template-columns: 48px 1fr;
  border-bottom: 1px solid var(--hairline);
  background: rgba(200,216,192,0.35);
  backdrop-filter: blur(8px);
  color: var(--dusk);
  position: sticky;
  top: 0;
  z-index: 10;
}

.list-section-head .sh-num {
  font-size: 18px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--hairline);
  padding: 8px 0;
  color: var(--dusk);
}

.list-section-head .sh-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  padding: 0 16px;
  color: var(--dusk);
}

.list-section-head.closed-head {
  background: rgba(255,255,255,0.35);
  color: var(--stone-soft);
}

.list-section-head.closed-head .sh-num { border-right: 1px solid var(--hairline); color: var(--stone-soft); }
.list-section-head.closed-head .sh-label { color: var(--stone-soft); }

/* Cards */
.card {
  display: grid;
  grid-template-columns: 48px 1fr;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer;
  transition: background .12s;
  background: rgba(255,255,255,0.3);
}

.card:hover { background: rgba(255,255,255,0.65); }
.card.active {
  background: rgba(74,85,104,0.06);
  border-left: 3px solid var(--dusk);
}
.card.closed-card { opacity: 1; }
.card.closed-card .card-name { color: var(--stone-soft); }
.card.closed-card .card-hours { color: var(--stone-soft); opacity: 0.7; }
.card.closed-card .card-meta { color: var(--stone-soft); opacity: 0.75; }
.card.closed-card .card-index { color: var(--stone-soft); }
.card.closed-card .card-link { color: var(--stone-soft); border-color: var(--hairline); }

.card.closed-card:hover { background: rgba(255,255,255,0.55); }
.card.closed-card:hover .card-name { color: var(--stone); }
.card.closed-card:hover .card-hours { color: var(--stone); opacity: 1; }
.card.closed-card:hover .card-meta { color: var(--stone); opacity: 1; }
.card.closed-card:hover .card-index { color: var(--stone); }
.card.closed-card:hover .card-link { color: var(--stone); border-color: rgba(45,55,72,0.2); }

.card-index {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--stone-soft);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 18px;
  border-right: 1px solid var(--hairline);
}

.card.active .card-index { color: var(--stone); border-right-color: var(--hairline); }

.card-body { padding: 16px 20px 14px; }

.card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}

.card-name {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.2;
  color: var(--ink);
}

.status-mark {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.status-mark.open .status-dot { background: #6aab8e; }
.status-mark.open { color: #4a8870; }
.card.active .status-mark.open .status-dot { background: #6aab8e; }

.status-mark.closed .status-dot { border: 1px solid var(--stone-soft); background: transparent; }
.status-mark.closed { color: var(--stone-soft); }

.card-hours {
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.01em;
  color: var(--stone);
  margin-bottom: 8px;
  font-style: italic;
}

.card.active .card-hours { color: var(--stone); }

.card-meta {
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--stone-soft);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.card-links {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.card-link {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--dusk);
  text-decoration: none;
  border: 1px solid rgba(74,85,104,0.25);
  border-radius: var(--r-pill);
  padding: 3px 10px;
  transition: background .1s, color .1s, border-color .1s;
  display: inline-block;
  background: rgba(255,255,255,0.5);
}

.card-link:hover { background: var(--dusk); color: var(--white); border-color: var(--dusk); }
.card.active .card-link { border-color: rgba(74,85,104,0.3); color: var(--dusk); }
.card.active .card-link:hover { background: var(--dusk); color: var(--white); border-color: var(--dusk); }



/* ── MAP PANE ── */
.map-pane {
  position: sticky;
  top: 0;
  height: calc(100vh - 140px);
  overflow: hidden;
  border-radius: 0;
}

#map { width: 100%; height: 100%; }

/* Leaflet DS overrides */
.leaflet-container { background: #e8f0f0; font-family: 'DM Sans', sans-serif; }

.leaflet-popup-content-wrapper {
  background: rgba(255,255,255,0.92);
  color: var(--ink);
  border: 1px solid var(--hairline);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  backdrop-filter: blur(10px);
}

.leaflet-popup-tip-container { display: none; }
.leaflet-popup-content { margin: 12px 16px; line-height: 1.7; }
.leaflet-popup-content strong {
  font-size: 14px;
  font-weight: 500;
  display: block;
  margin-bottom: 2px;
  color: var(--ink);
}

.leaflet-control-zoom { border: 1px solid var(--hairline) !important; border-radius: var(--r-sm) !important; box-shadow: var(--shadow-sm) !important; overflow: hidden; }
.leaflet-control-zoom a { border-radius: 0 !important; font-family: 'DM Sans', sans-serif !important; font-weight: 400 !important; color: var(--stone) !important; border-bottom: 1px solid var(--hairline) !important; background: rgba(255,255,255,0.85) !important; }

/* ── EMPTY STATE ── */
.empty-state {
  padding: 64px 40px;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--stone-soft);
  border-bottom: 1px solid var(--hairline);
  text-align: center;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--hairline);
  display: grid;
  grid-template-columns: 48px 1fr auto;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
}

footer .f-mark {
  border-right: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
}

footer .f-mark::after {
  content: '';
  width: 12px;
  height: 12px;
  background: var(--sage);
  border-radius: 50%;
}

footer .f-text {
  font-size: 11px;
  letter-spacing: 0.03em;
  font-weight: 400;
  color: var(--stone-soft);
  padding: 12px 20px;
  display: flex;
  align-items: center;
}

footer .f-date {
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--stone-soft);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  border-left: 1px solid var(--hairline);
}

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .layout.split { grid-template-columns: 1fr; }
  .map-pane { position: static; height: 320px; }
  .masthead-title { font-size: 36px; }
  .masthead-right { display: none; }
  .list-scroll { max-height: none; }
  .nav-row-locations { padding: 0 16px; }
  .nav-row-controls { padding: 8px 16px; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .nav-row-controls::-webkit-scrollbar { display: none; }
  .time-badge { display: none; }
  .search-panel { padding: 0 16px; }
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <span class="masthead-eyebrow">North Oregon Coast — Dining Guide</span>
    <h1 class="masthead-title">open <em>coast</em></h1>
  </div>
  <div class="masthead-right">
    <div class="open-counter">
      <span class="num" id="openNum">—</span>
      <span class="label">Open Now</span>
      <span class="sublabel">of <span id="totalNum">—</span> places</span>
    </div>
    <button class="search-trigger" id="searchTrigger" aria-label="Search" onclick="toggleSearch()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="11.4" y1="11.4" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<nav class="toolbar" role="navigation" aria-label="Filters and view controls">

  <!-- SEARCH PANEL (slides in above location tabs) -->
  <div class="search-panel" id="searchPanel">
    <div class="search-panel-inner">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="9.9" y1="9.9" x2="13" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input class="search-input" id="searchInput" type="search" placeholder="search by name…" autocomplete="off" oninput="onSearch(this.value)">
      <span class="search-result-count" id="searchCount"></span>
      <button class="search-close" onclick="closeSearch()">close</button>
    </div>
  </div>

  <!-- ROW 1: LOCATION TABS -->
  <div class="nav-row-locations" id="locRow" data-group="location">
    <button class="loc-tab active" onclick="setLocation('all')">All</button>
    <button class="loc-tab" onclick="setLocation('astoria')">Astoria</button>
    <button class="loc-tab" onclick="setLocation('warrenton')">Warrenton</button>
    <button class="loc-tab" onclick="setLocation('gearhart')">Gearhart</button>
    <button class="loc-tab" onclick="setLocation('seaside')">Seaside</button>
    <button class="loc-tab" onclick="setLocation('cannon-beach')">Cannon Beach</button>
    <button class="loc-tab" onclick="setLocation('nehalem')">Nehalem</button>
    <button class="loc-tab" onclick="setLocation('manzanita')">Manzanita</button>
  </div>

  <!-- ROW 2: CHIPS + TIME -->
  <div class="nav-row-controls">

    <div class="ctrl-group" data-group="view">
      <button class="chip" onclick="setView('list')">List</button>
      <button class="chip active" onclick="setView('split')">Split</button>
      <button class="chip" onclick="setView('map')">Map</button>
    </div>

    <div class="ctrl-divider"></div>

const ptNow = new Date(new Date().toLocaleString("en-US",{timeZone:"America/Los_Angeles"}));
const dayIdx = ptNow.getDay();
const curMin = ptNow.getHours()*60+ptNow.getMinutes();

// raw[day] is null (closed), [open,close] in minutes, or [[open,close],…] for split shifts.
// Day keys follow Date.getDay(): 0 = Sunday. A close past 1440 runs into the next morning.
function dayRanges(p,d){ const r=p.raw[d]; return !r?[]:(Array.isArray(r[0])?r:[r]); }
function fmtMin(m){ m=m%1440; const h=Math.floor(m/60), mm=m%60; return `${h%12||12}:${String(mm).padStart(2,"0")} ${h<12?"AM":"PM"}`; }
function openRange(p){
  const late=dayRanges(p,(dayIdx+6)%7).find(r=>r[1]>1440&&curMin<r[1]-1440);
  if(late) return late;
  return dayRanges(p,dayIdx).find(r=>curMin>=r[0]&&curMin<r[1])||null;
}
function isOpen(p){ return !!openRange(p); }
function todayHours(p){ return p.hours[dayIdx]||"Closed"; }
function hoursLine(p){
  const cur=openRange(p);
  if(cur) return `Open until ${fmtMin(cur[1])}`;
  const today=dayRanges(p,dayIdx);
  if(!today.length) return "Closed today";
  const next=today.find(r=>r[0]>curMin)||today[0];
  return `Opens ${fmtMin(next[0])}`;
}

let viewMode="split", filterMode="all", locationFilter="all", searchQuery="", activeIdx=null, map=null, markers=[];

const LOCATION_META = {
  "cannon-beach": { label:"Cannon Beach", center:[45.893,-123.962], zoom:14 },
  "seaside":       { label:"Seaside",       center:[45.9936,-123.9228], zoom:14 },
  "gearhart":      { label:"Gearhart",      center:[46.0272,-123.9180], zoom:14 },
  "warrenton":     { label:"Warrenton",     center:[46.1648,-123.9234], zoom:13 },
  "astoria":       { label:"Astoria",       center:[46.1877,-123.8320], zoom:14 },
  "manzanita":     { label:"Manzanita",     center:[45.7187,-123.9340], zoom:15 },
  "nehalem":       { label:"Nehalem",       center:[45.7160,-123.8935], zoom:14 },
};

function setView(v){
  viewMode=v;
  document.querySelectorAll('[data-group="view"] .chip').forEach(b=>{
    b.classList.toggle("active",["list","split","map"][["List","Split","Map"].indexOf(b.textContent.trim())]===v);
  });
  render();
}

function setLocation(loc){
  locationFilter=loc;
  document.querySelectorAll('[data-group="location"] .loc-tab').forEach(b=>{
    const m=b.getAttribute("onclick").match(/setLocation\('(.+?)'\)/);
    b.classList.toggle("active", m && m[1]===loc);
  });
  if(map && loc!=="all"){
    const m=LOCATION_META[loc];
    if(m) map.setView(m.center,m.zoom);
  } else if(map && loc==="all"){
    map.setView([45.993,-123.910],10);
  }
  render();
}

function setFilter(f){
  filterMode=f;
  const labels={all:"All",open:"Open Now",restaurant:"Restaurant",cafe:"Café"};
  document.querySelectorAll('[data-group="filter"] .chip').forEach(b=>{
    b.classList.toggle("active",b.textContent.trim()===labels[f]);
  });
  render();
}

function toggleSearch(){
  const panel=document.getElementById("searchPanel");
  const trigger=document.getElementById("searchTrigger");
  const locRow=document.getElementById("locRow");
  const isOpen=panel.classList.contains("open");
  if(isOpen){
    closeSearch();
  } else {
    panel.classList.add("open");
    locRow.style.display="none";
    trigger.classList.add("active");
    setTimeout(()=>document.getElementById("searchInput").focus(), 50);
  }
}

function closeSearch(){
  const panel=document.getElementById("searchPanel");
  const trigger=document.getElementById("searchTrigger");
  const locRow=document.getElementById("locRow");
  panel.classList.remove("open");
  locRow.style.display="";
  trigger.classList.remove("active");
  searchQuery="";
  const input=document.getElementById("searchInput");
  if(input) input.value="";
  document.getElementById("searchCount").classList.remove("visible");
  render();
}

function onSearch(val){
  searchQuery=val.trim().toLowerCase();
  render();
  const countEl=document.getElementById("searchCount");
  if(searchQuery){
    const n=getFiltered().length;
    countEl.textContent=`${n} result${n===1?"":"s"}`;
    countEl.classList.add("visible");
  } else {
    countEl.classList.remove("visible");
  }
}

function getFiltered(){
  return PLACES.filter(p=>{
    if(locationFilter!=="all" && p.location!==locationFilter) return false;
    if(filterMode==="open") return isOpen(p);
    if(filterMode==="restaurant") return p.type==="restaurant";
    if(filterMode==="cafe") return p.type==="cafe";
    return true;
  }).filter(p=>{
    if(!searchQuery) return true;
    return p.name.toLowerCase().includes(searchQuery);
  }).sort((a,b)=>{
    const ao=isOpen(a),bo=isOpen(b);
    if(ao&&!bo) return -1; if(!ao&&bo) return 1;
    return b.rating-a.rating;
  });
}

function render(){
  const layout=document.getElementById("layout");
  const listPane=document.getElementById("listPane");
  const mapPane=document.getElementById("mapPane");
  const scroll=document.getElementById("listScroll");

  layout.className="layout"+(viewMode==="split"?" split":"");
  listPane.style.display=viewMode==="map"?"none":"block";
  mapPane.style.display=viewMode==="list"?"none":"block";
  if(viewMode!=="list") initMap();

  const list=getFiltered();
  scroll.innerHTML="";

  const openItems=list.filter(p=>isOpen(p));
  const closedItems=list.filter(p=>!isOpen(p));

  function renderSection(items, isOpenSection, labelOverride){
    if(!items.length) return;
    const head=document.createElement("div");
    const label = labelOverride || (isOpenSection?"Open Now":"Closed Today");
    head.className="list-section-head"+(isOpenSection?"":" closed-head");
    head.innerHTML=`<span class="sh-num">${items.length}</span><span class="sh-label">${label}</span>`;
    scroll.appendChild(head);

    items.forEach(p=>{
      const gIdx=PLACES.indexOf(p);
      const open=isOpen(p);
      const card=document.createElement("div");
      card.className="card"+(open?"":" closed-card")+(activeIdx===gIdx?" active":"");

      const links=[];
      if(p.website) links.push(`<a class="card-link" href="${p.website}" target="_blank" rel="noopener">Website</a>`);
      if(p.menu) links.push(`<a class="card-link" href="${p.menu}" target="_blank" rel="noopener">Menu</a>`);
      links.push(`<a class="card-link" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">Map</a>`);
      if(p.phone) links.push(`<a class="card-link" href="tel:${p.phone}">Call</a>`);

      card.innerHTML=`
        <span class="card-index">${String(gIdx+1).padStart(2,"0")}</span>
        <div class="card-body">
          <div class="card-top">
            <span class="card-name">${p.name}</span>
            <span class="status-mark ${open?"open":"closed"}"><span class="status-dot"></span>${open?"Open":"Closed"}</span>
          </div>
          <div class="card-hours">${hoursLine(p)}</div>
          <div class="card-meta">
            <span>${p.rating} ★ &nbsp;${p.reviews.toLocaleString()} reviews</span>
            <span>·</span>
            <span>${p.type.toUpperCase()}</span>
            <span>·</span>
            <span>${(LOCATION_META[p.location]||{label:p.location}).label}</span>
          </div>
          <div class="card-links">${links.join("")}</div>
        </div>
      `;
      card.onclick=()=>{ activeIdx=gIdx; highlightMarker(p); render(); };
      scroll.appendChild(card);
    });
  }

  if(filterMode==="open"){
    renderSection(list, true);
  } else {
    renderSection(openItems, true);
    renderSection(closedItems, false);
  }

  if(!list.length){
    const e=document.createElement("div");
    e.className="empty-state";
    e.textContent=searchQuery ? `No results for "${searchQuery}"` : "No results";
    scroll.appendChild(e);
  }

  const scopedPlaces = locationFilter==="all" ? PLACES : PLACES.filter(p=>p.location===locationFilter);
  const openCount=scopedPlaces.filter(isOpen).length;
  document.getElementById("openNum").textContent=openCount;
  document.getElementById("totalNum").textContent=scopedPlaces.length;

  const timeStr=ptNow.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Los_Angeles"});
  document.getElementById("timeBadge").textContent=timeStr+" PT";
  document.getElementById("footerDate").textContent=ptNow.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

  markers.forEach((m,i)=>m.setOpacity(list.includes(PLACES[i])?1:0.2));
}

function initMap(){
  if(map) return;
  map=L.map("map",{center:[45.993,-123.910],zoom:10});
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, © Esri',
    maxZoom:16
  }).addTo(map);

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{
    maxZoom:16
  }).addTo(map);

  PLACES.forEach((p,i)=>{
    const open=isOpen(p);
      const size=open?8:6;
      const icon=L.divIcon({
        className:"",
        html:`<div style="width:${size}px;height:${size}px;background:${open?"#6aab8e":"#a0aab8"};border:2px solid ${open?"#4a8870":"rgba(160,170,184,0.5)"};border-radius:50%;box-shadow:0 1px 4px rgba(45,55,72,0.18);"></div>`,
        iconSize:[size,size],iconAnchor:[size/2,size/2]
      });
    const marker=L.marker([p.lat,p.lng],{icon}).addTo(map);
    marker.bindPopup(`<strong>${p.name}</strong>${open?"<br>Open now":"<br>Closed"}<br><span style="color:#555;font-style:italic;">${todayHours(p)}</span>`);
    marker.on("click",()=>{ activeIdx=i; render(); });
    markers.push(marker);
  });
}

function highlightMarker(p){
  if(!map) return;
  const idx=PLACES.indexOf(p);
  if(markers[idx]){ map.setView([p.lat,p.lng],15); markers[idx].openPopup(); }
}

function detectAndInit() {
  if (!navigator.geolocation) { render(); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    let closest = null, minDist = Infinity;
    for (const [key, meta] of Object.entries(LOCATION_META)) {
      const d = Math.hypot(lat - meta.center[0], lng - meta.center[1]);
      if (d < minDist) { minDist = d; closest = key; }
    }
    if (closest && minDist < 0.15) {
      setLocation(closest);
    } else {
      render();
    }
  }, () => render());
}

detectAndInit();

// Close search on Escape
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && document.getElementById("searchPanel").classList.contains("open")){
    closeSearch();
